<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Search | Quantum-Powered</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quantum-background">
        <div class="quantum-dots"></div>
        <div class="energy-pulse"></div>
        <div class="nebula-effect"></div>
        <div class="floating-cubes"></div>
    </div>
    
    <div class="main-container">
        <div class="search-hero">
            <div class="title-container">
                <h1 class="main-title">
                    <span class="title-part-1">NEXUS</span>
                    <span class="title-part-2">SEARCH</span>
                </h1>
                <div class="title-sub">Quantum-Powered Discovery</div>
            </div>
            
            <div class="search-container">
                <div class="search-input-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Ask the universe...">
                    <div class="input-highlight"></div>
                    <div class="input-border"></div>
                </div>
                <button id="search-btn" class="search-btn">
                    <span class="btn-text">INITIATE</span>
                    <span class="btn-glow"></span>
                    <span class="btn-particles"></span>
                </button>
            </div>
            
            <div class="search-hint">
                <div class="hint-icon">?</div>
                <div class="hint-text">Type "shakra" for hidden access</div>
            </div>
        </div>
    </div>
    
    <div class="result-page" id="result-page"></div>
    
    <script src="script.js"></script>
</body>
</html>
